name: "💡 개선 제안"
description: "한국어 번역·사용성·기능 개선을 제안해 주세요."
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        # 한국어판 개선 제안
        불편한 점과 원하는 동작을 구체적으로 적어 주세요. 원본 기능 변경이 필요한 제안은 Upstream과의 호환성도 함께 검토합니다.
  - type: checkboxes
    id: checklist
    attributes:
      label: 확인 사항
      options:
        - label: 기존 이슈에 같은 제안이 있는지 확인했습니다.
          required: true
  - type: textarea
    id: description
    attributes:
      label: 개선할 내용
      description: 현재의 불편과 개선 후 원하는 동작, 필요한 이유를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 예시
      description: 번역 대안, 화면 예시 또는 관련 자료를 첨부할 수 있습니다.
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: 추가 정보
    validations:
      required: false
